<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCA - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
    }
    .login-header {
      background: linear-gradient(135deg, #1d4ed8, #0d9488);
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
    .login-body { padding: 2rem; }
    .btn-login {
      background: linear-gradient(135deg, #1d4ed8, #0d9488);
      border: none;
      color: #fff;
      width: 100%;
      padding: .75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
  </style>
</head>
<body>

<div class="login-card card">
  <div class="login-header">
    <i class="bi bi-file-earmark-check" style="font-size:2.5rem"></i>
    <h4 class="mt-2 mb-0">Facturación Electrónica</h4>
    <div class="opacity-75 small mt-1">ARCA</div>
  </div>

  <div class="login-body">
    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold" for="username">
          <i class="bi bi-person"></i> Usuario
        </label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Ingresá tu usuario" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" for="password">
          <i class="bi bi-lock"></i> Contraseña
        </label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Ingresá tu contraseña" required>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
      </button>
    </form>
  </div>
</div>

</body>
</html>
